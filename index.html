<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaFyGuiden - Klara Matematik- och Fysikprovet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'in': 'in 0.6s ease-out',
              'fade-in': 'fade-in 0.5s ease-out',
              'slide-in-from-top-3': 'slide-in-from-top-3 0.5s ease-out',
              'slide-in-from-bottom-4': 'slide-in-from-bottom-4 0.6s ease-out',
              'slide-in-from-bottom-5': 'slide-in-from-bottom-5 0.6s ease-out',
              'slide-in-from-bottom-6': 'slide-in-from-bottom-6 0.6s ease-out',
              'zoom-in-95': 'zoom-in-95 0.6s ease-out',
            },
            keyframes: {
              'in': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'slide-in-from-top-3': {
                '0%': { opacity: '0', transform: 'translateY(-12px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'slide-in-from-bottom-4': {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'slide-in-from-bottom-5': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'slide-in-from-bottom-6': {
                '0%': { opacity: '0', transform: 'translateY(24px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'zoom-in-95': {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
            },
          }
        }
      }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Animation Styles */
      .perspective-container {
        perspective: 2000px;
      }
      
      .dashboard-entrance {
        opacity: 0; /* Start hidden */
        transform-style: preserve-3d;
        animation: dashboard-reveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 0.1s;
        will-change: transform, opacity;
        transform-origin: center top;
      }

      @keyframes dashboard-reveal {
        0% {
          opacity: 0;
          transform: scale(0.92) translateY(60px) rotateX(20deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0) rotateX(0deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
