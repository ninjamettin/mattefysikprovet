<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom checkbox style */
        .custom-checkbox:checked {
            background-color: #7c3aed;
            border-color: #7c3aed;
        }
        .custom-checkbox:checked:after {
            content: '';
            position: absolute;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            top: 2px;
            left: 5px;
            transform: rotate(45deg);
        }

        /* Smooth animation transitions */
        path, circle {
            transition: fill 0.3s ease;
        }
        
        /* Prevent layout shift during font load */
        html { -webkit-font-smoothing: antialiased; }
    </style>
<link id="all-fonts-link-font-geist" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-geist">.font-geist { font-family: 'Geist', sans-serif !important; }</style><link id="all-fonts-link-font-roboto" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-roboto">.font-roboto { font-family: 'Roboto', sans-serif !important; }</style><link id="all-fonts-link-font-montserrat" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-montserrat">.font-montserrat { font-family: 'Montserrat', sans-serif !important; }</style><link id="all-fonts-link-font-poppins" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-poppins">.font-poppins { font-family: 'Poppins', sans-serif !important; }</style><link id="all-fonts-link-font-playfair" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;900&amp;display=swap"><style id="all-fonts-style-font-playfair">.font-playfair { font-family: 'Playfair Display', serif !important; }</style><link id="all-fonts-link-font-instrument-serif" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-instrument-serif">.font-instrument-serif { font-family: 'Instrument Serif', serif !important; }</style><link id="all-fonts-link-font-merriweather" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&amp;display=swap"><style id="all-fonts-style-font-merriweather">.font-merriweather { font-family: 'Merriweather', serif !important; }</style><link id="all-fonts-link-font-bricolage" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-bricolage">.font-bricolage { font-family: 'Bricolage Grotesque', sans-serif !important; }</style><link id="all-fonts-link-font-jakarta" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-jakarta">.font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif !important; }</style><link id="all-fonts-link-font-manrope" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-manrope">.font-manrope { font-family: 'Manrope', sans-serif !important; }</style><link id="all-fonts-link-font-space-grotesk" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-space-grotesk">.font-space-grotesk { font-family: 'Space Grotesk', sans-serif !important; }</style><link id="all-fonts-link-font-work-sans" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-work-sans">.font-work-sans { font-family: 'Work Sans', sans-serif !important; }</style><link id="all-fonts-link-font-pt-serif" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&amp;display=swap"><style id="all-fonts-style-font-pt-serif">.font-pt-serif { font-family: 'PT Serif', serif !important; }</style><link id="all-fonts-link-font-geist-mono" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-geist-mono">.font-geist-mono { font-family: 'Geist Mono', monospace !important; }</style><link id="all-fonts-link-font-space-mono" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap"><style id="all-fonts-style-font-space-mono">.font-space-mono { font-family: 'Space Mono', monospace !important; }</style><link id="all-fonts-link-font-quicksand" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-quicksand">.font-quicksand { font-family: 'Quicksand', sans-serif !important; }</style><link id="all-fonts-link-font-nunito" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-nunito">.font-nunito { font-family: 'Nunito', sans-serif !important; }</style><link id="all-fonts-link-font-newsreader" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..800&amp;display=swap"><style id="all-fonts-style-font-newsreader">.font-newsreader { font-family: 'Newsreader', serif !important; }</style><link id="all-fonts-link-font-google-sans-flex" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-google-sans-flex">.font-google-sans-flex { font-family: 'Google Sans Flex', sans-serif !important; }</style><link id="all-fonts-link-font-oswald" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-oswald">.font-oswald { font-family: 'Oswald', sans-serif !important; }</style><link id="all-fonts-link-font-dm-sans" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-dm-sans">.font-dm-sans { font-family: 'DM Sans', sans-serif !important; }</style></head>
<body class="bg-white min-h-screen w-full flex overflow-hidden selection:bg-violet-100 selection:text-violet-700">

    <!-- Left Side: Interactive Illustration -->
    <!-- Added id="blob-container" for JS sizing -->
    <div id="blob-container" class="hidden lg:flex w-1/2 bg-slate-50 relative items-end justify-center overflow-hidden border-r border-slate-200">
        
        <!-- Background Grid Pattern for texture -->
        <div class="z-0 opacity-[0.4] absolute top-0 right-0 bottom-0 left-0" style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 32px 32px"></div>

        <!-- Container for the SVG Animation -->
        <svg id="scene" class="w-full h-full absolute inset-0 z-10 pointer-events-none" preserveAspectRatio="none" viewBox="0 0 600 855">
            <g id="shapes-container">
                <!-- Purple Shape (Back Left) -->
                <path id="shape-purple" fill="#7c3aed" class="drop-shadow-xl"></path>
                <g id="eyes-purple">
                    <circle class="eye-white" r="7" fill="white"></circle>
                    <circle class="pupil" r="3" fill="#1e1b4b"></circle>
                    <circle class="eye-white" r="7" fill="white"></circle>
                    <circle class="pupil" r="3" fill="#1e1b4b"></circle>
                    <path class="mouth" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none"></path>
                </g>

                <!-- Black Shape (Middle Back) -->
                <path id="shape-black" fill="#334155" class="drop-shadow-lg"></path>
                <g id="eyes-black">
                    <circle class="eye-white" r="6" fill="white"></circle>
                    <circle class="pupil" r="2.5" fill="#0f172a"></circle>
                    <circle class="eye-white" r="6" fill="white"></circle>
                    <circle class="pupil" r="2.5" fill="#0f172a"></circle>
                </g>

                <!-- Yellow Shape (Middle Front) -->
                <path id="shape-yellow" fill="#fbbf24" class="drop-shadow-lg"></path>
                <g id="eyes-yellow">
                    <circle class="pupil" r="3" fill="#451a03"></circle>
                    <circle class="pupil" r="3" fill="#451a03"></circle>
                    <path class="mouth" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"></path>
                </g>

                <!-- Orange Shape (Front Left) -->
                <path id="shape-orange" fill="#f97316" class="drop-shadow-xl"></path>
                <g id="eyes-orange">
                    <circle class="pupil" r="3" fill="#431407"></circle>
                    <circle class="pupil" r="3" fill="#431407"></circle>
                    <path class="mouth" stroke="#431407" stroke-width="2" stroke-linecap="round" fill="none"></path>
                </g>
            </g>
        </svg>
    </div>

    <!-- Right Side: Login Form -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center items-center p-8 lg:p-24 relative z-20 bg-white">
        
        <div class="w-full max-w-sm space-y-10">
            <!-- Header -->
            <div class="flex flex-col items-center space-y-4">
                <div class="h-10 w-10 bg-violet-600 rounded-lg flex items-center justify-center transform -rotate-6 shadow-md shadow-violet-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="zap" class="lucide lucide-zap text-white w-5 h-5"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg>
                </div>
                <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">Welcome back</h1>
                <p class="text-sm text-slate-500 text-center">Enter your credentials to access your account.</p>
            </div>

            <!-- Form -->
            <form class="space-y-6" onsubmit="event.preventDefault();">
                
                <!-- Email Input -->
                <div class="group space-y-1">
                    <label for="email" class="block text-xs font-medium text-slate-700">Email address</label>
                    <input type="email" name="email" id="email" class="block w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:border-violet-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-violet-500 transition-all" placeholder="name@company.com" required="">
                </div>

                <!-- Password Input -->
                <div class="group space-y-1">
                    <div class="flex items-center justify-between">
                         <label for="password" class="block text-xs font-medium text-slate-700">Password</label>
                         <a href="#" class="text-xs font-medium text-violet-600 hover:text-violet-700 transition-colors">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" name="password" id="password" class="block w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:border-violet-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-violet-500 transition-all" placeholder="••••••••" required="">
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center">
                    <input id="remember" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-violet-600 focus:ring-violet-600 custom-checkbox cursor-pointer">
                    <label for="remember" class="ml-2 block text-xs text-slate-600 select-none cursor-pointer">Remember me for 30 days</label>
                </div>

                <!-- Login Button -->
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all">
                    Sign in
                </button>

                <!-- Divider -->
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200"></div>
                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="bg-white px-2 text-slate-500">Or continue with</span>
                    </div>
                </div>

                <!-- Google Login -->
                <button type="button" class="w-full flex justify-center items-center gap-2 py-2 px-4 border border-slate-200 rounded-md shadow-sm bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200 transition-all">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23.52 12.29C23.52 11.43 23.44 10.6 23.3 9.8H12V14.51H18.47C18.18 16.01 17.34 17.29 16.08 18.14V21.14H19.96C22.23 19.05 23.52 15.98 23.52 12.29Z" fill="#4285F4"></path>
                        <path d="M12 24C15.24 24 17.96 22.92 19.96 21.14L16.08 18.14C15 18.86 13.62 19.29 12 19.29C8.87 19.29 6.22 17.18 5.27 14.33H1.24V17.43C3.21 21.36 7.28 24 12 24Z" fill="#34A853"></path>
                        <path d="M5.27 14.33C5.03 13.47 4.9 12.56 4.9 11.63C4.9 10.7 5.03 9.79 5.27 8.93V5.83H1.24C0.45 7.42 0 9.21 0 11.63C0 14.05 0.45 15.84 1.24 17.43L5.27 14.33Z" fill="#FBBC05"></path>
                        <path d="M12 4.01C13.76 4.01 15.34 4.62 16.59 5.8L20.03 2.37C17.95 0.44 15.24 0 12 0C7.28 0 3.21 2.64 1.24 6.57L5.27 9.67C6.22 6.82 8.87 4.01 12 4.01Z" fill="#EA4335"></path>
                    </svg>
                    Google
                </button>
            </form>

            <!-- Footer -->
            <p class="text-center text-xs text-slate-500">
                Don't have an account? <a href="#" class="font-medium text-violet-600 hover:text-violet-500 hover:underline transition-all">Sign up</a>
            </p>
        </div>
    </div>

    <!-- Logic -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        // Canvas / SVG Configuration
        const svg = document.getElementById('scene');
        const container = document.getElementById('blob-container');
        const passwordInput = document.getElementById('password');
        let isPasswordFocused = false;

        // Shape Configuration (Offsets relative to Center)
        const shapes = [
            // Purple (Back Left)
            { id: 'purple', baseH: 260, w: 130, xOffset: -90, color: '#7c3aed', eyes: true, eyeOffset: {x: 30, y: 50} },
            // Black (Middle Back)
            { id: 'black', baseH: 220, w: 100, xOffset: 20, color: '#1e293b', eyes: true, eyeOffset: {x: 20, y: 50} },
            // Yellow (Middle Front)
            { id: 'yellow', baseH: 160, w: 90, xOffset: 100, color: '#fbbf24', eyes: true, eyeOffset: {x: 25, y: 35} },
            // Orange (Front Left)
            { id: 'orange', baseH: 120, w: 160, xOffset: -60, color: '#f97316', eyes: true, eyeOffset: {x: 60, y: 45} }
        ];

        let mouse = { x: 0, y: 0 };
        let containerRect = { width: 0, height: 0, left: 0, top: 0 };

        // Handle Resizing
        function resize() {
            if(container) {
                containerRect = container.getBoundingClientRect();
                // Update SVG viewBox to match the container's pixel size 1:1 for easy math
                svg.setAttribute('viewBox', `0 0 ${containerRect.width} ${containerRect.height}`);
            }
        }
        
        window.addEventListener('resize', resize);
        
        // Initial call after DOM load
        window.addEventListener('DOMContentLoaded', resize);
        // Force resize after a slight delay to ensure layout is settled
        setTimeout(resize, 100);

        // Mouse Tracking (attached to window to catch movements outside the div easily)
        window.addEventListener('mousemove', (e) => {
            if(!containerRect.width) return;
            // Calculate mouse relative to the container
            mouse.x = e.clientX - containerRect.left;
            mouse.y = e.clientY - containerRect.top;
        });

        // Password Focus Logic
        if(passwordInput) {
            passwordInput.addEventListener('focus', () => isPasswordFocused = true);
            passwordInput.addEventListener('blur', () => isPasswordFocused = false);
        }

        // Animation Loop
        function animate() {
            if(!containerRect.width) {
                requestAnimationFrame(animate);
                return;
            }

            const centerX = containerRect.width / 2;
            const bottomY = containerRect.height;
            
            shapes.forEach((shape) => {
                const el = document.getElementById(`shape-${shape.id}`);
                const groupEyes = document.getElementById(`eyes-${shape.id}`);
                
                // Position X based on center + offset
                const baseX = centerX + shape.xOffset - (shape.w / 2); // Centered on their coordinate
                const baseY = bottomY;

                // Physics: Elastic Pull towards mouse
                const dx = mouse.x - (baseX + shape.w/2);
                const dy = mouse.y - (baseY - shape.baseH);
                
                // Dampening factors (how stretchy they are)
                const dampX = 0.12; 
                const dampY = 0.08; 
                
                // Limit the stretch distance to avoid breaking the illustration
                const leanX = Math.max(-120, Math.min(120, dx * dampX));
                const leanY = Math.max(-60, Math.min(60, dy * dampY));

                // 4 Points of the Shape
                const bl = { x: baseX, y: baseY }; // Bottom Left (Fixed)
                const br = { x: baseX + shape.w, y: baseY }; // Bottom Right (Fixed)
                
                // Top points move with lean
                const tl = { x: baseX + leanX, y: baseY - shape.baseH + leanY };
                const tr = { x: baseX + shape.w + leanX, y: baseY - shape.baseH + leanY };

                // Draw Shape Path based on ID style
                let d = '';
                if (shape.id === 'orange') {
                     // Wide Blob
                     // Uses cubic bezier for organic top
                     d = `M ${bl.x} ${bl.y} L ${br.x} ${br.y} L ${tr.x} ${tr.y + 50} C ${tr.x - 10} ${tr.y - 50} ${tl.x + 10} ${tl.y - 50} ${tl.x} ${tl.y + 50} Z`;
                } else if (shape.id === 'yellow') {
                    // Pill Shape
                     d = `M ${bl.x} ${bl.y} L ${br.x} ${br.y} L ${tr.x} ${tr.y + 20} C ${tr.x} ${tr.y - 30} ${tl.x} ${tl.y - 30} ${tl.x} ${tl.y + 20} Z`;
                } else {
                    // Standard elastic rect (Purple/Black)
                     d = `M ${bl.x} ${bl.y} L ${br.x} ${br.y} L ${tr.x} ${tr.y} Q ${tr.x + (tl.x-tr.x)/2} ${tr.y - 20} ${tl.x} ${tl.y} Z`;
                }

                if(el) el.setAttribute('d', d);

                // Update Eyes Position
                if (shape.eyes && groupEyes) {
                    const children = groupEyes.children;
                    const eyeLevelY = (tl.y + tr.y) / 2 + shape.eyeOffset.y;
                    const eyeCenterX = (tl.x + tr.x) / 2;

                    // Determine eye spacing
                    let leftEyeX, rightEyeX;
                    if (shape.id === 'orange') {
                        leftEyeX = eyeCenterX + 10; 
                        rightEyeX = eyeCenterX + 40; 
                    } else if (shape.id === 'yellow') {
                        leftEyeX = eyeCenterX + 15;
                        rightEyeX = eyeCenterX + 40;
                    } else {
                        leftEyeX = eyeCenterX - 15;
                        rightEyeX = eyeCenterX + 15;
                    }

                    // Pupil Movement Logic
                    let pupilOffsetX = 0;
                    let pupilOffsetY = 0;

                    if (isPasswordFocused) {
                        // Look Away (Up/Left or Up/Right)
                        pupilOffsetX = (shape.id === 'purple' || shape.id === 'orange') ? -5 : 5;
                        pupilOffsetY = -4;
                    } else {
                        // Track Mouse
                        const angle = Math.atan2(mouse.y - eyeLevelY, mouse.x - eyeCenterX);
                        // Limit pupil distance
                        const dist = Math.min(3, Math.hypot(mouse.x - eyeCenterX, mouse.y - eyeLevelY) / 30);
                        pupilOffsetX = Math.cos(angle) * dist;
                        pupilOffsetY = Math.sin(angle) * dist;
                    }

                    // Update DOM Elements
                    // Purple & Black have [white, pupil, white, pupil, mouth?]
                    // Orange & Yellow have [pupil, pupil, mouth]
                    
                    if (shape.id === 'purple' || shape.id === 'black') {
                        // Whites
                        children[0].setAttribute('cx', leftEyeX);
                        children[0].setAttribute('cy', eyeLevelY);
                        children[2].setAttribute('cx', rightEyeX);
                        children[2].setAttribute('cy', eyeLevelY);

                        // Pupils
                        children[1].setAttribute('cx', leftEyeX + pupilOffsetX);
                        children[1].setAttribute('cy', eyeLevelY + pupilOffsetY);
                        children[3].setAttribute('cx', rightEyeX + pupilOffsetX);
                        children[3].setAttribute('cy', eyeLevelY + pupilOffsetY);
                        
                        // Mouth (Purple)
                        if(children[4]) {
                            children[4].setAttribute('d', `M ${eyeCenterX - 3} ${eyeLevelY + 12} L ${eyeCenterX - 3} ${eyeLevelY + 18}`);
                        }

                    } else {
                        // Just Pupils
                        children[0].setAttribute('cx', leftEyeX + pupilOffsetX);
                        children[0].setAttribute('cy', eyeLevelY + pupilOffsetY);
                        children[1].setAttribute('cx', rightEyeX + pupilOffsetX);
                        children[1].setAttribute('cy', eyeLevelY + pupilOffsetY);

                         // Mouths
                         const mouth = children[2];
                         if(mouth) {
                             if (shape.id === 'yellow') {
                                // Small line mouth
                                mouth.setAttribute('d', `M ${rightEyeX} ${eyeLevelY + 12} L ${rightEyeX + 12} ${eyeLevelY + 12}`);
                             } else {
                                 // Happy smile for orange
                                 mouth.setAttribute('d', `M ${leftEyeX + 5} ${eyeLevelY + 10} Q ${eyeCenterX + 25} ${eyeLevelY + 18} ${rightEyeX - 5} ${eyeLevelY + 10}`);
                             }
                         }
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        // Start Animation
        animate();

    </script>

</body></html>
